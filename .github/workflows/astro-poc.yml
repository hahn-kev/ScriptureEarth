name: Build & Deploy (astro-poc)

# Full from-scratch build of the static Astro site:
#   fetch JSON dump  →  project to content/  →  astro build  →  (optional) Cloudflare Pages.
# The publish step is skipped when the Cloudflare secrets are absent, so the build
# still runs (and fails loudly on data problems) without deploy access.
#
# Scoped to the astro-poc branch for now. Required/optional configuration:
#   secrets.SE_KEY                 (required)  API key for the dump endpoint
#   vars.SE_DUMP_PATH              (optional)  dump endpoint path (default /api/db_dump.php)
#   vars.SE_BASE                   (optional)  API host (default https://www.scriptureearth.org)
#   secrets.CLOUDFLARE_API_TOKEN   (optional)  present → publish; absent → skip
#   secrets.CLOUDFLARE_ACCOUNT_ID  (optional)  present → publish; absent → skip

on:
  push:
    branches: [astro-poc]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch JSON dump
        run: npm run fetch:dump
        env:
          SE_KEY: ${{ secrets.SE_KEY }}
          SE_BASE: ${{ vars.SE_BASE }}
          SE_DUMP_PATH: ${{ vars.SE_DUMP_PATH }}

      - name: Download playlist cache
        run: npm run setup:data # scripture.json already present → just fetches the video playlist .txt cache so clips are reliably expanded (no slow/flaky per-file fetch at build time)

      - name: Build site
        run: npm run build:dump # project scripture.json → content/ then astro build

      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping Pages publish (build only)."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.publish == 'true'
        run: npm run deploy # runs predeploy (precompress) then npx wrangler pages deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
