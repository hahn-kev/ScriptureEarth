name: Preview cleanup

# Scheduled prune of stale Cloudflare Pages *preview* deployments for the
# se-proto-en project. preview.yml creates one preview deployment per push on
# every PR branch and never deletes them, and Cloudflare cannot clean them up on
# its own: they are Direct Uploads, so `--branch` is only a label and Cloudflare
# never learns that a branch was merged or deleted.
#
# Rules, for preview deployments created more than MAX_AGE_DAYS (30) ago:
#   - Superseded builds (not aliased): deleted.
#   - The latest build of a branch (aliased; it backs <branch>.se-proto-en.pages.dev):
#     Cloudflare refuses a plain DELETE. We look up the branch's PR and force-delete
#     only when every PR for that branch closed more than MAX_AGE_DAYS ago, so a
#     closed PR's preview link stays up for a month after it closes. Open PRs, PRs
#     closed recently, and branches with no PR keep their link.
# Production deployments are never touched (environment filter).
#
# The job self-gates: until the Cloudflare secrets are configured it skips
# (green) with a notice. Required configuration:
#   secrets.CLOUDFLARE_API_TOKEN   token with Account · Cloudflare Pages · Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID  Cloudflare account id

on:
  schedule:
    # 07:00 UTC every Monday
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete previews older than this, and branch links of PRs closed longer ago than this (days)'
        required: false
        default: '30'

permissions:
  contents: read
  pull-requests: read  # look up whether a preview's branch has an open or recently closed PR

concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check cleanup prerequisites
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview cleanup skipped — set secrets.CLOUDFLARE_API_TOKEN and secrets.CLOUDFLARE_ACCOUNT_ID to enable."
          fi

  prune:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: se-proto-en
      MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '30' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prune stale preview deployments
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/${PROJECT}/deployments"
          auth="Authorization: Bearer ${CF_TOKEN}"
          cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Pruning preview deployments created before ${cutoff}"

          # Collect every candidate first, then delete. Deleting while paging
          # shifts later deployments onto earlier pages and skips them.
          # The Pages API caps per_page at 25 and returns 400 above that.
          candidates=$(mktemp)
          scanned=0 page=1
          while :; do
            code=$(curl -sS -o /tmp/list.json -w '%{http_code}' -H "$auth" \
              "${api}?env=preview&per_page=25&page=${page}")
            if [ "$code" != "200" ] || [ "$(jq -r '.success' /tmp/list.json)" != "true" ]; then
              echo "::error::Cloudflare API listing failed (HTTP ${code})"
              jq -c '.errors // .' /tmp/list.json >&2 || cat /tmp/list.json >&2
              exit 1
            fi

            count=$(jq '.result | length' /tmp/list.json)
            [ "$count" -eq 0 ] && break

            jq -r --arg cutoff "$cutoff" \
              '.result[] | select(.environment == "preview" and .created_on < $cutoff) | [.id, .created_on, (.deployment_trigger.metadata.branch // "")] | @tsv' \
              /tmp/list.json >> "$candidates"

            scanned=$((scanned + count))
            total_pages=$(jq -r '.result_info.total_pages // 0' /tmp/list.json)
            [ "$total_pages" -gt 0 ] && [ "$page" -ge "$total_pages" ] && break
            page=$((page + 1))
          done

          # Branch verdicts, cached so each branch hits the GitHub API once:
          #   force:<closed>   every PR for the branch closed before the cutoff
          #   keep:<reason>    open PR, closed too recently, or no PR found
          declare -A verdict
          branch_verdict() {
            local b=$1 prs
            if [ -z "${verdict[$b]+x}" ]; then
              prs=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$b" --state all --limit 50 --json state,closedAt) \
                || { verdict[$b]="keep:PR lookup failed"; return; }
              verdict[$b]=$(jq -r --arg cutoff "$cutoff" '
                if length == 0 then "keep:no PR found"
                elif any(.[]; .state == "OPEN") then "keep:PR open"
                else (map(.closedAt) | max) as $c
                  | if $c < $cutoff then "force:\($c)" else "keep:PR closed \($c[:10])" end
                end' <<<"$prs")
            fi
          }

          # Log lines lead with the action and branch so a run reads by branch:
          #   deleted  <branch>  superseded build (<date>, <id>)
          #   deleted  <branch>  branch link, PR closed <date> (<id>)
          #   kept     <branch>  branch link, <reason> (<id>)
          log() { printf '%-8s %-45s %s\n' "$1" "${2:-(unknown branch)}" "$3"; }

          deleted=0 expired=0 kept=0 failed=0
          kept_rows=$(mktemp)
          while IFS=$'\t' read -r id created branch; do
            [ -z "$id" ] && continue
            day=${created%%T*}
            code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE -H "$auth" "${api}/${id}")
            if [ "$code" = "200" ]; then
              log deleted "$branch" "superseded build (${day}, ${id})"
              deleted=$((deleted + 1))
              continue
            fi

            # 8000035: still aliased, i.e. the latest build behind a branch preview link.
            if ! jq -e '[.errors[]?.code] | index(8000035)' /tmp/del.json >/dev/null 2>&1; then
              echo "::warning::could not delete ${branch:-(unknown branch)} build ${id} (${day}) — HTTP ${code}: $(jq -c '.errors' /tmp/del.json 2>/dev/null)"
              failed=$((failed + 1))
              continue
            fi

            if [ -z "$branch" ]; then
              v="keep:branch unknown"
            else
              branch_verdict "$branch"
              v=${verdict[$branch]}
            fi
            if [ "${v%%:*}" != "force" ]; then
              log kept "$branch" "branch link, ${v#keep:} (built ${day}, ${id})"
              printf '| `%s` | %s | %s |\n' "${branch:-(unknown)}" "${v#keep:}" "$day" >> "$kept_rows"
              kept=$((kept + 1))
              continue
            fi

            closed=${v#force:}
            code=$(curl -s -o /tmp/del.json -w '%{http_code}' -X DELETE -H "$auth" "${api}/${id}?force=true")
            if [ "$code" = "200" ]; then
              log deleted "$branch" "branch link, PR closed ${closed%%T*} (${id})"
              expired=$((expired + 1))
            else
              echo "::warning::force delete of ${branch} branch link ${id} failed — HTTP ${code}: $(jq -c '.errors' /tmp/del.json 2>/dev/null)"
              failed=$((failed + 1))
            fi
          done < "$candidates"

          echo "Done. deleted=${deleted} expired_links=${expired} kept=${kept} failed=${failed} scanned=${scanned}"
          {
            echo "### Cloudflare preview cleanup"
            echo ""
            echo "- Cutoff: \`${cutoff}\` (older than ${MAX_AGE_DAYS} days)"
            echo "- Deleted superseded builds: ${deleted}"
            echo "- Deleted branch links (PR closed before cutoff): ${expired}"
            echo "- Kept branch links: ${kept}"
            echo "- Failed: ${failed}"
            if [ -s "$kept_rows" ]; then
              echo ""
              echo "| Kept branch link | Reason | Built |"
              echo "| --- | --- | --- |"
              sort "$kept_rows"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
