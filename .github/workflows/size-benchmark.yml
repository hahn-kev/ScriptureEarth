name: Size benchmark

# Cold-load size-regression gate for the Astro build (astro/bench/SIZE-BENCH-SPEC.md).
# Builds the site, produces dist/assets/sizes.json, diffs it against the sizes.json
# currently deployed to production, posts a sticky PR comment, then fails if any
# gated metric grew past its fail band.
#
# Configuration (same knobs as deploy.yml):
#   secrets.SE_KEY                   (required)  API key for the dump endpoint
#   vars.SE_BASE / vars.SE_DUMP_PATH (optional)  endpoint overrides
#   vars.SIZE_BENCH_BASELINE_URL     (optional)  baseline sizes.json URL
#                                                (default: prod origin /assets/sizes.json)
#
# Fork-PR caveat: on a pull_request from a fork, GITHUB_TOKEN is read-only, so the
# sticky-comment step 403s. Same-repo PRs work as-is.

on:
  pull_request:
    branches: [main]
    paths:
      - 'astro/**'
      - '.github/workflows/size-benchmark.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # required to post/update the sticky comment

concurrency:
  group: size-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: ./.github/actions/build-site
        with:
          se-key: ${{ secrets.SE_KEY }}
          se-base: ${{ vars.SE_BASE }}
          se-dump-path: ${{ vars.SE_DUMP_PATH }}

      - name: Produce sizes.json
        working-directory: astro
        run: node scripts/build_sizes.mjs

      # Diff vs the prod baseline; render the markdown report + verdict. Never
      # fails here — a missing/404 baseline is report-only (spec §4).
      - name: Compare against baseline
        working-directory: astro
        run: node scripts/check_sizes.mjs --report size-report.md --verdict size-verdict.txt
        env:
          SIZE_BENCH_BASELINE_URL: ${{ vars.SIZE_BENCH_BASELINE_URL }}

      - name: Post sticky comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: size-benchmark
          path: astro/size-report.md

      # Separate gate: the comment is already posted, THEN fail on a breach.
      - name: Enforce size budget
        working-directory: astro
        run: |
          if [ "$(cat size-verdict.txt)" = "fail" ]; then
            echo "::error::Cold-load size exceeds the fail-band budget"
            exit 1
          fi
