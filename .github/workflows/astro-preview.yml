name: Preview (astro-poc PRs)

# Cloudflare Pages *preview* deployment for pull requests targeting astro-poc.
# Same from-scratch build as astro-poc.yml (fetch dump -> SQLite -> extract ->
# astro build), but deployed with --branch <pr-branch> so Cloudflare treats it
# as a preview and mints a per-branch URL, which is posted back as a PR comment.
#
# The job self-gates: until every prerequisite is configured it skips (green)
# with a notice, so PRs are not blocked by a red check before the data endpoint
# and Cloudflare credentials exist. Required configuration:
#   secrets.SE_KEY                 API key for the dump endpoint
#   vars.SE_DUMP_PATH              dump endpoint path (e.g. /api/db_dump.php)
#   vars.SE_BASE                   (optional) API host (default https://scriptureearth.org)
#   secrets.CLOUDFLARE_API_TOKEN   token with Account · Cloudflare Pages · Edit
#   secrets.CLOUDFLARE_ACCOUNT_ID  Cloudflare account id

on:
  pull_request:
    branches: [astro-poc]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: astro-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check preview prerequisites
        id: check
        env:
          SE_KEY: ${{ secrets.SE_KEY }}
          SE_DUMP_PATH: ${{ vars.SE_DUMP_PATH }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$SE_KEY" ] && [ -n "$SE_DUMP_PATH" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Preview skipped — set secrets.SE_KEY, vars.SE_DUMP_PATH, secrets.CLOUDFLARE_API_TOKEN and secrets.CLOUDFLARE_ACCOUNT_ID to enable Cloudflare PR previews."
          fi

  preview:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch DB dump
        run: npm run fetch:dump
        env:
          SE_KEY: ${{ secrets.SE_KEY }}
          SE_BASE: ${{ vars.SE_BASE }}
          SE_DUMP_PATH: ${{ vars.SE_DUMP_PATH }}

      - name: Convert dump to SQLite
        run: npm run convert:dump
        env:
          SE_STRICT: '1' # fail the build if scripture_main (the spine) is empty

      - name: Build site
        run: npm run build:dump

      - name: Precompress dist
        run: npm run predeploy

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: astro
          command: pages deploy dist --project-name=se-proto-en --branch=${{ github.head_ref }}

      - name: Comment preview URL
        if: steps.deploy.outputs.deployment-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- cf-preview -->';
            const lines = [marker, '### ⚡ Cloudflare preview', '', `**Latest:** ${process.env.PREVIEW_URL}`];
            if (process.env.ALIAS_URL) lines.push(`**Branch alias:** ${process.env.ALIAS_URL}`);
            lines.push('', `_Updated for ${context.sha.slice(0, 7)} · redeploys on each push._`);
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
